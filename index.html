<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambient Music — Seamless Wave Lab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f7f7f3;color:#111;font-family:"Courier New",Courier,monospace;overflow-x:hidden}
.intro{height:70vh;display:grid;place-items:center;text-align:center}
.intro h1{font-weight:400;font-size:clamp(34px,6vw,76px);letter-spacing:-.07em;margin:0}
.intro p{font-size:11px;opacity:.45;line-height:1.7}
.stage{position:relative;min-height:720vh;padding:5vh 0 80vh;overflow:hidden}
.waveRow{height:48px;position:relative;margin:0;overflow:visible}
.waveSvg{position:absolute;left:-25vw;width:150vw;height:125px;overflow:visible}
.waveText{font-size:20px;letter-spacing:-.05em;fill:#111}
.controls{
 position:fixed;z-index:50;top:16px;right:16px;width:275px;background:rgba(247,247,243,.96);
 border:1px solid #222;padding:14px;font:10px "Courier New",Courier,monospace
}
.controls h2{font:400 14px "Courier New",monospace;margin:0 0 11px}
.control{display:grid;grid-template-columns:92px 1fr 35px;gap:7px;align-items:center;margin:7px 0}
.control input[type=range]{width:100%;accent-color:#111}.control output{text-align:right}
.row2{display:flex;gap:7px;margin-top:10px}
button{font:11px "Courier New",Courier,monospace;background:#f7f7f3;border:1px solid #222;padding:7px;cursor:pointer;flex:1}
button:hover{background:#111;color:white}
select{width:100%;font:11px "Courier New",Courier,monospace;padding:5px;background:white}
.colorline{display:grid;grid-template-columns:92px 1fr;align-items:center;margin:7px 0}
.colorline input{width:100%;height:24px;border:0;background:none}
.readout{position:fixed;left:15px;bottom:12px;font-size:9px;opacity:.3}
</style>
</head>
<body>
<section class="intro"><div><h1>AMBIENT MUSIC</h1><p>Brian Eno<br><br>scroll to disturb the current</p></div></section>
<main class="stage" id="stage"></main>

<aside class="controls">
<h2>TOOL 1 — WAVE LAB</h2>
<div class="control"><label>Wave height</label><input id="amp" type="range" min="0" max="42" value="37"><output>37</output></div>
<div class="control"><label>Wave length</label><input id="length" type="range" min="120" max="700" value="538"><output>538</output></div>
<div class="control"><label>Base motion</label><input id="base" type="range" min="0" max="2" step=".05" value=".85"><output>.85</output></div>
<div class="control"><label>Scroll boost</label><input id="boost" type="range" min="0" max="1.5" step=".05" value=".75"><output>.75</output></div>
<div class="control"><label>Row spacing</label><input id="spacing" type="range" min="30" max="105" value="39"><output>39</output></div>
<div class="control"><label>Type size</label><input id="type" type="range" min="11" max="30" value="19"><output>19</output></div>
<div class="control"><label>Wave motion</label><input id="wiggle" type="range" min="0" max="3" step=".1" value=".2"><output>.2</output></div>
<hr style="border:0;border-top:1px solid #aaa;margin:12px 0 10px">
<h2 style="margin-bottom:8px">SCROLL REACTION</h2>
<div class="control"><label>Speed reaction</label><input id="speedReact" type="range" min="0" max="2" step=".05" value=".75"><output>.75</output></div>
<div class="control"><label>Overlap reaction</label><input id="overlapReact" type="range" min="0" max="2" step=".05" value=".90"><output>.90</output></div>
<div class="control"><label>Settle time</label><input id="settle" type="range" min=".80" max=".97" step=".01" value=".90"><output>.90</output></div>

<div class="colorline"><label>Text color</label><input id="color" type="color" value="#111111"></div>
<div class="colorline"><label>Background</label><input id="bg" type="color" value="#f7f7f3"></div>
<label>Direction pattern</label><select id="pattern"><option value="alternate">Alternating</option><option value="left">All left</option><option value="right">All right</option><option value="mixed">Mixed currents</option></select>
<div class="row2"><button id="hide">Hide controls</button><button id="reset">Your settings</button></div>
</aside>
<div class="readout">scroll energy <span id="energy">0</span></div>

<script>
const article=`In 1978 I released the first record which described itself as Ambient Music, a name I invented to describe an emerging musical style.

It happened like this. In the early seventies, more and more people were changing the way they were listening to music. Records and radio had been around long enough for some of the novelty to wear off, and people were wanting to make quite particular and sophisticated choices about what they played in their homes and workplaces, what kind of sonic mood they surrounded themselves with.

The manifestation of this shift was a movement away from the assumptions that still dominated record-making at the time — that people had short attention spans and wanted a lot of action and variety, clear rhythms and song structures and, most of all, voices. To the contrary, I was noticing that my friends and I were making and exchanging long cassettes of music chosen for its stillness, homogeneity, lack of surprises and, most of all, lack of variety. We wanted to use music in a different way-as part of the ambience of our lives — and we wanted it to be continuous, a surrounding.

At the same time there were other signs on the horizon. Because of the development of recording technology, a whole host of compositional possibilities that were quite new to music came into existence. Most of these had to do with two closely related new areas — the development of the texture of sound itself as a focus for compositional attention, and the ability to create with electronics virtual acoustic spaces (acoustic spaces that don’t exist in nature).

When you walk into a recording studio, you see thousands of knobs and controls. Nearly all of these are different ways of doing the same job: they allow you to do things to sounds, to make them fatter or thinner or shinier or rougher or harder or smoother or punchier or more liquid or any one of a thousand other things. So a recording composer may spend a great deal of her compositional energy effectively inventing new sounds or combinations of sounds. Of course, this was already well known by the mid sixties: psychedelia expanded not only minds but recording technologies as well. But there was still an assumption that playing with sound itself was a ‘merely’ technical job — something engineers and producers did — as opposed to the serious creative work of writing songs and playing instruments. With Ambient Music, I wanted to suggest that this activity was actually one of the distinguishing characteristics of new music, and could in fact become the main focus of compositional attention.

Studios have also offered composers virtual spaces. Traditional recording put a mike in front of an instrument in a nice-sounding space and recorded the result . What you heard was the instrument and it’s reverberation in that space. By the forties, people were getting a little more ambitious, and starting to invent technologies that could supplement these natural spaces — echo chambers, tape delay systems, etc. A lot of this work was done for radio — to be able to ‘ locate’ characters in different virtual spaces in radio dramas — but it was popular music which really opened the subject up. Elvis and Buddy and Eddy and all the others sang with weird tape repeats on their voices — unlike anything you’d ever hear in nature. Phil Spector and Joe Meek invented their own ‘sound’ — by using combinations of overdubbing, home-made echo units, resonant spaces like staircases and lifts shafts, changing tape-speeds and so on, they were able to make ‘normal’ instruments sound completely new. And all this was before synthesizers and dub reggae ...

By the early seventies, when I started making records, it was clear that This was where a lot of the action was going to be. It interested me because it suggested moving the process of making music much closer to the process of painting (which I thought I knew something about). New sound-shaping and space-making devices appeared on the market weekly (and still do), synthesizers made their clumsy but crucial debut , and people like me just sat at home night after night fiddling around with all this stuff, amazed at what was now possible, immersed in the new sonic worlds we could create.

And immersion was really the point : we were making music to swim in, to float in, to get lost inside.

This became clear to me when I was confined to bed, immobilized by an accident in early 1975. My friend Judy Nylon had visited, and brought with her a record of 17th-century harp music. I asked her to put it on as she left, which she did, but it wasn’t until she’s gone that I realized that the hi-fi was much too quiet and one of the speakers had given up anyway. It was raining hard outside, and I could hardly hear the music above the rain — just the loudest notes, like lit t le crystals, sonic icebergs rising out of the storm. I couldn’t get up and change it, so I Just lay there waiting for my next visit or to come and sort it out, and gradually I was seduced by this listening experience. I realized that this was what I wanted music to be — a place, a feeling, an all-around tint to my sonic environment .

After that, in April or May of that year, I made *Discreet Music*, which I suppose was really my first Ambient record (though the stuff I’d done with the great guitarist Robert Fripp before that gets pretty close). This was a 31-minute piece (the longest I could get on a record at the time) which was modal, evenly textured, calm and sonically warm. At the time, it was not a record that received a very warm welcome, and I probably would have hesitated to release it without the encouragement of my friend Peter Schmidt , the painter. (In fact, it ’s often been painters and writers — people who use music while they work and want to make for themselves a conducive environment — who’ve first enjoyed and encouraged this work.)

In late 1977 I was waiting for a plane in Cologne airport . It was early on a sunny, clear morning, the place was nearly empty, and the space of the building (designed, I believe, by the father of one of the founders of Kraftwerk) was very attractive. I started to wonder what kind of music would sound good in a building like that. I thought, ‘ It has to be interrupt ible (because there’ll be announcements), it has to work outside the frequencies at which people speak, and at different speeds from speech patterns (so as not to confuse communication), and it has to be able to accommodate all the noises that airports produce. And, most importantly for me, it has to have something to do with where you are and what you’re there for — flying, floating and, secretly, flirting with death.’ I thought, ‘I want to make a kind of music that prepares you for dying — that doesn’t get all bright and cheerful and pretend you’re not a little apprehensive, but which makes you say to yourself, “Actually, it’s not that big a deal if I die.”’

Thus was born the first Ambient record — *Music for Airports* — which I released on my own label (called Ambient Records, of course). The Inner sleeve of that release carried my manifesto:

Ambient Music
The concept of music designed specifically as a background feature in the environment was pioneered by Muzak Inc. in the fifties, and has since come carries are those particularly associated with the kind of material that Muzal Inc. produces — familiar tunes arranged and orchestrated in a lightweight and derivative manner. Understandably, this has led most discerning listeners (and most composers) to dismiss entirely the concept of environmental music as an idea worthy of attention.

Over the past three years, I have become interested in the use of music as ambience, and have come to believe that it is possible to produce material that can be used thus without being in any way compromised. To create a distinction between my own experiments in this area and the products of the various purveyors of canned music, I have begun using the term Ambient Music.

An ambience is defined as an atmosphere, or a surrounding influence: a tint. My intention is to produce original pieces ostensibly (but not exclusively) for particular times and situations with a view to building up a small but versatile catalogue of environmental music suited to a wide variety of moods and atmospheres.

Whereas the extant canned-music companies proceed from the basis of regularizing environments by blanketing their acoustic and atmospheric idiosyncrasies, Ambient Music is intended to enhance these. Whereas conventional background music is produced by stripping away all sense of doubt and uncertainty (and thus all genuine interest) from the music, Ambient Music retains these qualities. And whereas their intention is to ‘brighten’ the environment by adding stimulus to it (thus supposedly alleviating the tedium of routine tasks and levelling out the natural ups and downs of the body rhythms), Ambient Music is intended to induce calm and a spaa to think.

Ambient Music must be able to accommodate many levels of listening attention without enforcing one in particular; it must be as ignorable as it is interesting.
(September 1978)

Like a lot of the stuff I was doing at the time, this was regarded by many English music critics as a kind of arty joke, and they had a lot of fun with it. I’m therefore pleased that the idea has stuck around so long and keeps sprouting off in all sorts of directions: it comes back around to me like Chinese Whispers — unrecognizable but intriguing. Those early seeds (there were only four releases on the original Ambient Records label — *On Land* and *Music for Airports* by me, *The Plateaux of Mirror* by Harold Budd, and *Day of Radiance* by Laraaji) have contributed to a rich forest of music.
(1996)`;

const NS="http://www.w3.org/2000/svg";
const stage=document.querySelector("#stage");
const words=article.split(/\s+/);
let cursor=0, rows=[];

function nextChunk(n=36){
 let out=[];
 for(let i=0;i<n;i++){out.push(words[cursor%words.length]);cursor++}
 return out.join(" ")+"   ";
}
function build(){
 stage.innerHTML=""; rows=[]; cursor=0;
 for(let i=0;i<150;i++){
  const wrap=document.createElement("div"); wrap.className="waveRow";
  const svg=document.createElementNS(NS,"svg"); svg.classList.add("waveSvg"); svg.setAttribute("viewBox","0 0 1800 125"); svg.setAttribute("preserveAspectRatio","none");
  const path=document.createElementNS(NS,"path"); const pid="path-"+i; path.id=pid; path.setAttribute("fill","none");
  const text=document.createElementNS(NS,"text"); text.classList.add("waveText");
  const tp=document.createElementNS(NS,"textPath"); tp.setAttribute("href","#"+pid);
  // Long continuous passage, not isolated sentence fragments.
  const chunk=nextChunk(34); tp.textContent=(chunk+" "+chunk+" "+chunk+" "+chunk);
  text.appendChild(tp); svg.append(path,text); wrap.append(svg); stage.append(wrap);
  rows.push({wrap,svg,path,tp,offset:-25+(i*7)%20,phase:i*.28});
 }
}
build();

const $=id=>document.getElementById(id);
const controls=["amp","length","base","boost","spacing","type","wiggle","speedReact","overlapReact","settle"];
controls.forEach(id=>$(id).addEventListener("input",()=>$(id).nextElementSibling.value=$(id).value));

let lastY=scrollY,lastT=performance.now(),impulse=0,energy=0,time=0;
addEventListener("scroll",()=>{const n=performance.now(),dy=scrollY-lastY,dt=Math.max(8,n-lastT);impulse=Math.min(60,Math.abs(dy/dt*24));lastY=scrollY;lastT=n},{passive:true});

function direction(i){
 if($("pattern").value==="left")return -1;if($("pattern").value==="right")return 1;
 if($("pattern").value==="mixed")return [1,1,-1,1,-1,-1][i%6];
 return i%2?1:-1;
}
function animate(){
 energy+=(impulse-energy)*.16; impulse*=+$("settle").value; time+=.012;
 const amp=+$("amp").value, wavelength=+$("length").value, wiggle=+$("wiggle").value;
 const spacing=+$("spacing").value, type=+$("type").value;
 rows.forEach((r,i)=>{
   let d="";
   // shared wave field: adjacent lines are phases of the SAME current.
   // This is what removes the disconnected/choppy appearance.
   for(let x=0;x<=1800;x+=20){
     const globalPhase=(x/wavelength)*Math.PI*2 + time*wiggle;
     const rowPhase=i*.20;
     const y=62.5
       + Math.sin(globalPhase+rowPhase)*amp
       + Math.sin(globalPhase*.48-rowPhase*.65+time*wiggle*.32)*amp*.18;
     d+=(x?"L":"M")+x.toFixed(1)+","+y.toFixed(1)+" ";
   }
   r.path.setAttribute("d",d);
   const speedReaction=+$("speedReact").value;
   const overlapReaction=+$("overlapReact").value;
   const motion=(+$("base").value + energy*(+$("boost").value)*.11*speedReaction)*(1+(i%4)*.025);
   r.offset+=direction(i)*motion*.035;
   if(r.offset>0)r.offset=-20;if(r.offset<-45)r.offset=-20;
   r.tp.setAttribute("startOffset",r.offset+"%");

   // Tool 2: fast scrolling compresses neighboring currents together.
   // At rest, the exact Wave Lab row spacing is preserved.
   const compression=Math.min(spacing*.72, energy*overlapReaction*.72);
   const liveSpacing=Math.max(10, spacing-compression);
   r.wrap.style.height=liveSpacing+"px";
   r.svg.style.top=((liveSpacing-125)/2)+"px";
   r.svg.style.zIndex=String(i%3);
 });
 document.querySelectorAll(".waveText").forEach(t=>{t.style.fontSize=type+"px";t.style.fill=$("color").value});
 document.body.style.background=$("bg").value;document.documentElement.style.background=$("bg").value;
 document.querySelector(".controls").style.background=$("bg").value+"f5";
 $("energy").textContent=energy.toFixed(1);
 requestAnimationFrame(animate);
}
animate();

$("hide").onclick=()=>document.querySelector(".controls").style.display="none";
addEventListener("keydown",e=>{if(e.key.toLowerCase()==="c")document.querySelector(".controls").style.display="block"});
$("reset").onclick=()=>{
 const vals={amp:37,length:538,base:.85,boost:.75,spacing:39,type:19,wiggle:.2,speedReact:.75,overlapReact:.90,settle:.90};
 Object.entries(vals).forEach(([k,v])=>{$(k).value=v;$(k).nextElementSibling.value=v});
 $("pattern").value="alternate";$("color").value="#111111";$("bg").value="#f7f7f3";
};
</script>
</body></html>
